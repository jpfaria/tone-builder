[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tone-builder"
version = "0.4.1"
description = "Recreates the tone of a recording by measurement, and configures OpenRig, M-VAVE and Ampero II."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "João Paulo Faria" }]
dependencies = [
  "numpy==2.1.3",
  "scipy==1.14.1",
  "soundfile==0.12.1",
  "sounddevice==0.5.6",
  "PyYAML>=6.0",
  # jpfaria's own libs are never pinned (18/09): they all name each other by the SAME bare URL,
  # because pip refuses two different URLs for one package.
  "tone-analyzer @ git+https://github.com/jpfaria/tone-analyzer",
  "mvave[reamp] @ git+https://github.com/jpfaria/mvave",
  "ampero2[reamp] @ git+https://github.com/jpfaria/hotone-ampero-2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
tone-builder = "tone_builder.cli:main"

[tool.setuptools.packages.find]
include = ["tone_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

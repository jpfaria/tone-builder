[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tone-builder"
version = "0.1.0"
description = "Recreates the tone of a recording by measurement, and configures OpenRig, M-VAVE and Ampero II."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "João Paulo Faria" }]
dependencies = [
  "numpy==2.1.3",
  "soundfile==0.12.1",
  "sounddevice==0.5.6",
  "PyYAML>=6.0",
  "tone-analyzer @ git+https://github.com/jpfaria/tone-analyzer@v0.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
tone-builder = "tone_builder.cli:main"

[tool.setuptools.packages.find]
include = ["tone_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

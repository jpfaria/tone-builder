# Step 0 for "Alive" (Pearl Jam, Ten, London Bridge Studio, Seattle). Every quote was read on the opened page on 18/09/2026; search summaries were not used.
# Take provenance: the album take of "Alive" is the January 1991 London Bridge demo session (band then called Mookie Blaylock),
#   carried over to Ten; it is NOT from the March/April 1991 Ten sessions. McCready's outro solo was finished by Tim Palmer at the June 1991 mix in England.
#   Source: https://en.wikipedia.org/wiki/Alive_(Pearl_Jam_song) -- "The band, then called Mookie Blaylock, recorded 'Alive' during a demo session at London Bridge studio in January 1991. The version recorded during this session would later appear on the group's debut album, Ten."
#   Source: https://en.wikipedia.org/wiki/Ten_(Pearl_Jam_album) -- "A few tracks were previously recorded at London Bridge in January, but \"only 'Alive' was carried over from that session.\""
# Rhythm player: Stone Gossard (credited "rhythm guitar" in Ten personnel, Wikipedia Ten/Alive pages); lead/solo: Mike McCready.
# No source found gives gear specific to the "Alive" take; all blocks below are album-wide (Ten era) evidence.
